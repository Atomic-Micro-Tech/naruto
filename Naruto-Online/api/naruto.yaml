x-websocket:
  status: "Kontrak aplikasi tambahan; bukan operasi HTTP yang bisa dieksekusi sebagai REST."
  endpoint: "/v1/ws"
  subprotocol: "naruto.v1"
  encoding: "UTF-8 JSON, satu message per frame aplikasi."
  clientMessageSchema:
    $ref: "#/components/schemas/WsClientMessage"
  serverMessageSchema:
    $ref: "#/components/schemas/WsServerMessage"
  limits:
    maxFrameBytes: 16384
    heartbeatIntervalSeconds: 5
    heartbeatTimeoutSeconds: 15
    chatMaxCharacters: 300
    chatBurstMessages: 5
    chatWindowSeconds: 10
    waitingRoomReconnectSeconds: 30
    decisionInactivitySeconds: 120
  authentication: "Login email dahulu, minta tiket HTTP dengan CSRF, lalu upgrade. Cookie saja tidak menggantikan tiket. Origin diverifikasi. Sesi dicabut memutus socket; jangan log tiket."
  subscriptions: "Setelah hello, otomatis subscribe perubahan daftar room publik; current room dan active match hanya milik user. Reconnect mengirim room.snapshot dan resume harus mengirim match.resume. Kode privat hanya dikirim host; tidak dibroadcast publik."
  ordering: "Mutasi room memakai expectedRoomVersion, hanya waiting. Nama/settings diubah host; edit membatalkan ready semua pemain. room.ready juga memilih karakter awal. room.start hanya host ketika roster sah, semua ready dan assetsReady/hash sesuai. room.kick hanya host saat waiting dan tidak dapat menendang diri sendiri; room.invite.rotate hanya host privat. room.leave saat playing melepas koneksi kontrol ke CPU dan voice, bukan surrender. Setelah hasil server mengembalikan room ke waiting dengan ready=false; room.start membuat match baru."
  idempotency: "requestId wajib di semua pesan; mutasi didedup per user/type/requestId. match.command juga commandId persisten untuk seluruh umur match. chat.send memakai clientMessageId per user+room. Payload berbeda dengan ID sama -> IDEMPOTENCY_CONFLICT. command.ack diterbitkan sesudah commit; queued reclaim berarti antrian reclaim sudah persisten, belum memberi hak mengontrol."
  matchResume: "lastEventSequence adalah cursor match, bukan stateVersion. Server memberi event yang hilang sesuai hak user; jika log gap/terlalu besar beri match.snapshot. Client mengabaikan sequence duplikat, meminta resume pada gap. controller.changed menggunakan sequence match yang sama; jangan mengirim aksi controller baru sebelum epoch baru commit."
  takeover: "Disconnect terdeteksi -> controllerKind=cpu dan controlEpoch bertambah, job CPU memakai aiPolicyVersion yang tersimpan. Implementasi lokal saat ini memakai local-party-v1 dengan adaptasi terdokumentasi; bukan sertifikasi AI original 1:1. participantKind=user manusia tidak berubah. Wheel/tick/RNG dan aksi commit tidak direset. match.reclaim hanya pemilik slot dengan sesi sah; reclaim pada batas keputusan, epoch bertambah dan job lama dibatalkan. Semua user offline tidak mengakhiri match hanya karena semua controller CPU. Koneksi baru akun yang sama mencabut koneksi pengendali lama melalui sessionEpoch."
  gameCommands: "Client hanya mengirim niat dalam GameAction dan controlEpoch saat ini. MVP arena 1 menawarkan semua keputusan melalui choice.select; gunakan hanya action/options yang diterbitkan dalam allowedActions. Validasi turn/side/substate, optionId, inventori, biaya dan sasaran oleh server; pertahanan boleh membutuhkan keputusan slot non-turnSeat. Surrender confirm memerlukan choiceId aktif dari surrender.request. Cancel/confirm tanpa choiceId ditolak. Card targetSeat/targetTileId diterima hanya bila pilihan menu memerlukannya; keduanya tidak boleh dipakai sekaligus. No client-supplied seed, roll result, chakra, damage or actorId."
  presentation: "Tick logis 60 Hz bila diperlukan, tidak mengirim snapshot per frame. match.event MVP menyertakan snapshot proyeksi setelah event bisnis, bukan tick roulette. Client memajukan animasi dari serverTick. WS frame limit mencakup snapshot; implementasi wajib mengukur payload maksimum sebelum release."
  errorCodes:
    - "INVALID_MESSAGE"
    - "UNSUPPORTED_PROTOCOL"
    - "UNAUTHENTICATED"
    - "FORBIDDEN"
    - "ROOM_NOT_WAITING"
    - "ROOM_FULL"
    - "HOST_REQUIRED"
    - "NOT_READY"
    - "ASSET_VERSION_MISMATCH"
    - "VERSION_CONFLICT"
    - "STALE_CONTROL_EPOCH"
    - "NOT_CONTROLLER"
    - "INVALID_ACTION"
    - "INVALID_TARGET"
    - "CHOICE_EXPIRED"
    - "INSUFFICIENT_CHAKRA"
    - "INSUFFICIENT_SKILL_POINTS"
    - "ALREADY_USED"
    - "IDEMPOTENCY_CONFLICT"
    - "RATE_LIMITED"
    - "MATCH_FINISHED"
    - "CPU_CONTEXT_UNRESOLVED"
  closeCodes:
    "1000": "Normal / logout."
    "1008": "Policy violation / sesi dicabut / koneksi lama digantikan."
    "1009": "Frame terlalu besar."
    "1011": "Kesalahan server; reconnect menggunakan tiket baru."
  examples:
    client:
      protocolVersion: 1
      requestId: "11111111-1111-4111-8111-111111111111"
      type: "match.command"
      payload:
        commandId: "22222222-2222-4222-8222-222222222222"
        matchId: "33333333-3333-4333-8333-333333333333"
        expectedStateVersion: 7
        controlEpoch: 2
        action:
          type: "roll.stop"
          payload:
            rouletteId: "44444444-4444-4444-8444-444444444444"
    server:
      protocolVersion: 1
      type: "command.ack"
      serverTime: "2026-11-08T14:00:00Z"
      payload:
        requestId: "11111111-1111-4111-8111-111111111111"
        commandId: "22222222-2222-4222-8222-222222222222"
        stateVersion: 8
        eventSequence: 12
        duplicate: false
        outcome: "applied"
