# OpenAPI 3.1.0 — Naruto Online MVP lokal
# HTTP paths + x-websocket application protocol. Belum merupakan implementasi server.
openapi: "3.1.0"
info:
  title: "Naruto Online API"
  version: "0.1.0"
  summary: "Kontrak MVP lokal: email auth, room arena 1, gameplay, CPU takeover, chat dan voice."
  description: "Spesifikasi rencana, belum menyatakan server telah diimplementasikan. Sumber perilaku: ../PLAN.md, ../../GAME_RULE.md dan ../../AI_RULE.md relatif dari api/. Match dimulai dengan 2–4 manusia; CPU menggantikan controller saat disconnect, mempertahankan userId, participantKind, karakter dan state. Snapshot/event tidak memuat seed RNG atau state privat AI. Hanya PNG/WAV pada aset game; transport live voice memakai WebRTC. Facebook Instant Games ditambahkan sesudah MVP lokal matang; endpoint Facebook tidak termasuk kontrak aktif versi ini."
servers:
  -
    url: "http://localhost:8080"
    description: "Go lokal langsung; Origin localhost client harus diizinkan eksplisit."
  -
    url: "http://localhost:5173/api"
    description: "Vite proxy development; path /api dibuang sebelum diteruskan ke Go."
  -
    url: "https://{host}/api"
    description: "HTTPS LAN/staging melalui reverse proxy; ganti host dengan hostname bersertifikat tepercaya."
    variables:
      host:
        default: "naruto.local"
security:
  -
    sessionCookie:
      []
tags:
  -
    name: "System"
    description: "Health dan readiness."
  -
    name: "Auth"
    description: "Email/password dan sesi server."
  -
    name: "Arenas"
    description: "Arena yang diaktifkan."
  -
    name: "Rooms"
    description: "Daftar/create/join; perubahan anggota melalui WebSocket."
  -
    name: "Matches"
    description: "Proyeksi state dan hasil match."
  -
    name: "Chat"
    description: "Riwayat pesan; pengiriman melalui WebSocket."
  -
    name: "Voice"
    description: "Otorisasi WebRTC; audio tidak melewati WebSocket game."
  -
    name: "Moderation"
    description: "Block dan laporan."
  -
    name: "Realtime"
    description: "Upgrade dan kontrak pesan game."
paths:
  "/healthz":
    get:
      operationId: "getHealth"
      tags:
        - "System"
      summary: "Liveness proses Go"
      security:
        []
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                properties:
                  status:
                    type: "string"
                    const: "ok"
                required:
                  - "status"
  "/readyz":
    get:
      operationId: "getReadiness"
      tags:
        - "System"
      summary: "Readiness API dan PostgreSQL"
      security:
        []
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                properties:
                  status:
                    type: "string"
                    const: "ready"
                required:
                  - "status"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/register":
    post:
      operationId: "registerEmail"
      tags:
        - "Auth"
      summary: "Daftar menggunakan email, password dan nama"
      security:
        []
      description: "Tidak otomatis login. Email verifikasi dikirim melalui inbox lokal saat development. Validasi Origin pada request pra-login; jangan menampilkan password/token di log."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  verificationEmailSent:
                    type: "boolean"
                required:
                  - "user"
                  - "verificationEmailSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/login":
    post:
      operationId: "loginEmail"
      tags:
        - "Auth"
      summary: "Login email dan buat cookie sesi"
      security:
        []
      description: "Kredensial salah selalu INVALID_CREDENTIALS. Rotasi session ID; validasi Origin untuk mencegah login CSRF."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Session"
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/me":
    get:
      operationId: "getCurrentSession"
      tags:
        - "Auth"
      summary: "Identitas sesi dan token CSRF"
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/logout":
    post:
      operationId: "logout"
      tags:
        - "Auth"
      summary: "Cabut sesi, putus koneksi aktif dan cookie"
      description: "Jika pemilik berada dalam match, kehilangan koneksi memicu takeover CPU. Logout bukan aksi menyerah."
      parameters:
        -
          $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "Sesi dicabut; cookie dihapus."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/verify-email":
    post:
      operationId: "verifyEmail"
      tags:
        - "Auth"
      summary: "Konfirmasi token verifikasi sekali pakai"
      security:
        []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/resend-verification":
    post:
      operationId: "resendVerification"
      tags:
        - "Auth"
      summary: "Kirim ulang email verifikasi untuk akun aktif"
      parameters:
        -
          $ref: "#/components/parameters/Csrf"
      responses:
        "202":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/forgot-password":
    post:
      operationId: "forgotPassword"
      tags:
        - "Auth"
      summary: "Minta email reset password"
      security:
        []
      description: "Response generik tetap sama baik email ada maupun tidak."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/auth/reset-password":
    post:
      operationId: "resetPassword"
      tags:
        - "Auth"
      summary: "Ganti password menggunakan token reset"
      security:
        []
      description: "Token sekali pakai; seluruh sesi lama dicabut setelah reset berhasil."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/session/refresh":
    post:
      operationId: "refreshSession"
      tags:
        - "Auth"
      summary: "Perpanjang sesi aktif dan rotasi token CSRF"
      parameters:
        -
          $ref: "#/components/parameters/Csrf"
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Session"
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/ws-ticket":
    post:
      operationId: "createWebSocketTicket"
      tags:
        - "Realtime"
      summary: "Terbitkan tiket sekali pakai untuk upgrade WebSocket"
      parameters:
        -
          $ref: "#/components/parameters/Csrf"
      description: "Tiket terikat user, sesi dan Origin; berlaku 30 detik, sekali pakai. URL /v1/ws?ticket=... harus diredaksi dari log. Tiket baru diperlukan setiap reconnect."
      responses:
        "201":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/WsTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/arenas":
    get:
      operationId: "listArenas"
      tags:
        - "Arenas"
      summary: "Daftar arena yang dapat dipilih"
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Arena"
                    minItems: 1
                    maxItems: 1
                required:
                  - "items"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/rooms":
    get:
      operationId: "listRooms"
      tags:
        - "Rooms"
      summary: "Daftar room publik setelah login"
      parameters:
        -
          $ref: "#/components/parameters/Cursor"
        -
          $ref: "#/components/parameters/Limit"
        -
          name: "q"
          in: "query"
          schema:
            type: "string"
            maxLength: 60
        -
          name: "hasOpenSeat"
          in: "query"
          schema:
            type: "boolean"
            default: true
        -
          name: "status"
          in: "query"
          schema:
            type: "string"
            enum:
              - "waiting"
              - "playing"
              - "results"
            default: "waiting"
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/RoomPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: "createRoom"
      tags:
        - "Rooms"
      summary: "Buat room dan otomatis isi slot host"
      description: "Hanya arena-1, normal, 2–4 kursi; tidak ada kursi CPU manual. Pembuatan atomik. User hanya boleh menjadi anggota satu room aktif."
      parameters:
        -
          $ref: "#/components/parameters/Csrf"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/RoomMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/rooms/join-by-code":
    post:
      operationId: "joinRoomByCode"
      tags:
        - "Rooms"
      summary: "Gabung room privat menggunakan kode"
      description: "Kode salah/kedaluwarsa memberi 404. Transaksi mengunci kapasitas; kode tidak membuat peminta melewati autentikasi."
      parameters:
        -
          $ref: "#/components/parameters/Csrf"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/JoinByCodeRequest"
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/RoomMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/rooms/{roomId}":
    get:
      operationId: "getRoom"
      tags:
        - "Rooms"
      summary: "Detail room publik atau room yang diikuti"
      parameters:
        -
          $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/rooms/{roomId}/join":
    post:
      operationId: "joinRoom"
      tags:
        - "Rooms"
      summary: "Gabung kursi kosong pada room waiting"
      parameters:
        -
          $ref: "#/components/parameters/RoomId"
        -
          $ref: "#/components/parameters/Csrf"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      description: "Body {} untuk room publik. Room privat memerlukan inviteCode. Request berulang untuk keanggotaan yang sama mengembalikan membership tanpa slot tambahan. Match berjalan hanya menerima resume peserta lama, bukan join pemain baru."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/JoinRoomRequest"
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/RoomMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/rooms/{roomId}/messages":
    get:
      operationId: "listRoomMessages"
      tags:
        - "Chat"
      summary: "Ambil maksimum 50 pesan terakhir room"
      description: "Hanya anggota; urutan items naik menurut (createdAt,id). Cursor opaque mengambil halaman lebih lama. Batas cursor dikaitkan ke room."
      parameters:
        -
          $ref: "#/components/parameters/RoomId"
        -
          $ref: "#/components/parameters/Cursor"
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 50
            default: 50
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ChatPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/rooms/{roomId}/voice-token":
    post:
      operationId: "createVoiceToken"
      tags:
        - "Voice"
      summary: "Token voice audio-only untuk anggota manusia"
      description: "Hanya jika voiceEnabled dan anggota masih sah. Token maksimal 5 menit; refresh harus memeriksa ulang keanggotaan. Leave/kick mencabut akses SFU aktif. CPU tidak masuk voice. Tidak mengangkut audio lewat API HTTP atau WS game."
      parameters:
        -
          $ref: "#/components/parameters/RoomId"
        -
          $ref: "#/components/parameters/Csrf"
      responses:
        "201":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/VoiceToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/matches/{matchId}":
    get:
      operationId: "getMatch"
      tags:
        - "Matches"
      summary: "Snapshot match untuk peserta yang sedang login"
      description: "Dapat dipakai bootstrap/recovery dan hasil yang sudah selesai. Hanya pemilik slot; snapshot diproyeksikan sesuai haknya. Tidak otomatis mengembalikan kontrol CPU ke manusia; gunakan match.reclaim."
      parameters:
        -
          $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/MatchSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/reports":
    post:
      operationId: "createReport"
      tags:
        - "Moderation"
      summary: "Laporkan anggota room"
      parameters:
        -
          $ref: "#/components/parameters/Csrf"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      description: "Pelapor harus memiliki konteks membership room/match. Tidak ada upload atau rekaman audio; laporan voice hanya menyimpan konteks dan keterangan."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "201":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ReportReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/blocks/{userId}":
    put:
      operationId: "blockUser"
      tags:
        - "Moderation"
      summary: "Blokir pesan dan suara pengguna pada sisi pemilik"
      parameters:
        -
          $ref: "#/components/parameters/UserId"
        -
          $ref: "#/components/parameters/Csrf"
      description: "Idempotent. Block tidak mengubah kartu/target/hasil match dan bukan kick; client menegakkan mute peer voice sesuai daftar block."
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/UserBlock"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: "unblockUser"
      tags:
        - "Moderation"
      summary: "Hapus block pengguna"
      parameters:
        -
          $ref: "#/components/parameters/UserId"
        -
          $ref: "#/components/parameters/Csrf"
      responses:
        "204":
          description: "Block dihapus atau memang tidak ada."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/blocks":
    get:
      operationId: "listBlocks"
      tags:
        - "Moderation"
      summary: "Daftar pengguna yang diblokir"
      parameters:
        -
          $ref: "#/components/parameters/Cursor"
        -
          $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: "Berhasil."
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                properties:
                  items:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/UserBlock"
                  nextCursor:
                    anyOf:
                      -
                        type: "string"
                      -
                        type: "null"
                required:
                  - "items"
                  - "nextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/ws":
    get:
      operationId: "upgradeWebSocket"
      tags:
        - "Realtime"
      summary: "Upgrade koneksi ke protokol naruto.v1"
      security:
        -
          wsTicket:
            []
      parameters:
        -
          name: "Sec-WebSocket-Protocol"
          in: "header"
          required: true
          schema:
            type: "string"
            const: "naruto.v1"
      description: "Upgrade RFC 6455 dengan tiket sekali pakai dan Origin yang diizinkan. Setelah HTTP 101, kontrak frame JSON terdapat di x-websocket dan components.schemas.WsClientMessage/WsServerMessage. OpenAPI HTTP tidak mendeskripsikan transport frame secara native; generator biasa hanya memahami handshake. Frame ditolak jika >16 KiB. Semua event/action bisnis setelah upgrade memakai versi protokol 1."
      responses:
        "101":
          description: "Switching Protocols; pesan pertama connection.ready. Server memilih subprotocol naruto.v1."
          headers:
            Sec-WebSocket-Protocol:
              schema:
                type: "string"
                const: "naruto.v1"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "naruto_session"
      description: "Cookie HttpOnly/SameSite, Secure pada HTTPS; pengecualian Secure hanya localhost development. Nilai sesi tidak disalin ke JSON/localStorage. CSRF token wajib pada mutasi HTTP dengan cookie."
    wsTicket:
      type: "apiKey"
      in: "query"
      name: "ticket"
      description: "Tiket opaque dari POST /v1/ws-ticket, terikat sesi/Origin, sekali pakai dan 30 detik; bukan userId atau session cookie."
  parameters:
    Csrf:
      name: "X-CSRF-Token"
      in: "header"
      required: true
      schema:
        type: "string"
        minLength: 20
      description: "Token dari login/me/refresh, terikat sesi."
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        format: "uuid"
      description: "Scope user+operation, simpan hasil 24 jam. Key sama dan body sama mengembalikan hasil semula; body berbeda -> 409 IDEMPOTENCY_CONFLICT."
    Cursor:
      name: "cursor"
      in: "query"
      schema:
        type: "string"
        maxLength: 1024
      description: "Cursor opaque, terikat filter dan hak akses."
    Limit:
      name: "limit"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 50
        default: 20
    RoomId:
      name: "roomId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    MatchId:
      name: "matchId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    UserId:
      name: "userId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
  headers:
    SessionCookie:
      description: "Cookie naruto_session; HttpOnly; SameSite=Lax; Path=/; Secure pada HTTPS. Backend menetapkan expiry; tidak mengembalikan session ID lewat body."
      schema:
        type: "string"
  responses:
    BadRequest:
      description: "Request tidak valid."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "Sesi tidak ada, kedaluwarsa atau tiket tidak sah."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Akses, Origin, CSRF atau membership ditolak."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Resource tidak ditemukan atau tidak boleh terlihat oleh peminta."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "ROOM_FULL, ALREADY_IN_ROOM, ROOM_NOT_WAITING, VERSION_CONFLICT, EMAIL_IN_USE atau kondisi bisnis lain."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: "ARENA_UNAVAILABLE atau konfigurasi semantik tidak sah."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: "Batas request terlampaui."
      headers:
        Retry-After:
          description: "Detik sampai retry diperbolehkan."
          schema:
            type: "integer"
            minimum: 0
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: "Layanan sedang tidak tersedia."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Id:
      type: "string"
      format: "uuid"
    Version:
      type: "integer"
      minimum: 0
    Tick:
      type: "integer"
      minimum: 0
    Sha256:
      type: "string"
      pattern: "^[a-f0-9]{64}$"
    Error:
      type: "object"
      additionalProperties: false
      properties:
        error:
          type: "object"
          additionalProperties: false
          properties:
            code:
              type: "string"
            message:
              type: "string"
            requestId:
              type: "string"
              format: "uuid"
            fieldErrors:
              type: "array"
              items:
                type: "object"
                additionalProperties: false
                properties:
                  field:
                    type: "string"
                  message:
                    type: "string"
                required:
                  - "field"
                  - "message"
            retryAfterSeconds:
              type: "integer"
              minimum: 0
          required:
            - "code"
            - "message"
            - "requestId"
      required:
        - "error"
    Message:
      type: "object"
      additionalProperties: false
      properties:
        message:
          type: "string"
      required:
        - "message"
    User:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          type: "string"
          format: "email"
        displayName:
          type: "string"
          minLength: 1
          maxLength: 32
        emailVerified:
          type: "boolean"
        createdAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "email"
        - "displayName"
        - "emailVerified"
        - "createdAt"
    PlayerIdentity:
      type: "object"
      additionalProperties: false
      properties:
        userId:
          type: "string"
          format: "uuid"
        displayName:
          type: "string"
          minLength: 1
          maxLength: 32
      required:
        - "userId"
        - "displayName"
    RegisterRequest:
      type: "object"
      additionalProperties: false
      properties:
        email:
          type: "string"
          format: "email"
          maxLength: 254
        password:
          type: "string"
          minLength: 12
          maxLength: 128
          writeOnly: true
        displayName:
          type: "string"
          minLength: 1
          maxLength: 32
      required:
        - "email"
        - "password"
        - "displayName"
    LoginRequest:
      type: "object"
      additionalProperties: false
      properties:
        email:
          type: "string"
          format: "email"
          maxLength: 254
        password:
          type: "string"
          minLength: 1
          maxLength: 128
          writeOnly: true
      required:
        - "email"
        - "password"
    EmailRequest:
      type: "object"
      additionalProperties: false
      properties:
        email:
          type: "string"
          format: "email"
          maxLength: 254
      required:
        - "email"
    TokenRequest:
      type: "object"
      additionalProperties: false
      properties:
        token:
          type: "string"
          minLength: 20
          maxLength: 1024
          writeOnly: true
      required:
        - "token"
    ResetPasswordRequest:
      type: "object"
      additionalProperties: false
      properties:
        token:
          type: "string"
          minLength: 20
          maxLength: 1024
          writeOnly: true
        newPassword:
          type: "string"
          minLength: 12
          maxLength: 128
          writeOnly: true
      required:
        - "token"
        - "newPassword"
    Session:
      type: "object"
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"
        expiresAt:
          type: "string"
          format: "date-time"
        csrfToken:
          type: "string"
          minLength: 20
          description: "Kirim sebagai X-CSRF-Token pada mutasi HTTP dengan cookie sesi."
      required:
        - "user"
        - "expiresAt"
        - "csrfToken"
    WsTicket:
      type: "object"
      additionalProperties: false
      properties:
        ticket:
          type: "string"
          minLength: 20
        expiresAt:
          type: "string"
          format: "date-time"
        path:
          type: "string"
          const: "/v1/ws"
        protocol:
          type: "string"
          const: "naruto.v1"
      required:
        - "ticket"
        - "expiresAt"
        - "path"
        - "protocol"
    Arena:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          const: "arena-1"
        mapId:
          type: "integer"
          const: 0
        name:
          type: "string"
          const: "Arena 1"
        enabled:
          type: "boolean"
          const: true
        tileCount:
          type: "integer"
          const: 22
        worldWidth:
          type: "integer"
          const: 640
        worldHeight:
          type: "integer"
          const: 480
        thumbnailPath:
          type: "string"
          const: "image/arena1/map_00.png"
        rulesHash:
          $ref: "#/components/schemas/Sha256"
        assetManifestHash:
          $ref: "#/components/schemas/Sha256"
      required:
        - "id"
        - "mapId"
        - "name"
        - "enabled"
        - "tileCount"
        - "worldWidth"
        - "worldHeight"
        - "thumbnailPath"
        - "rulesHash"
        - "assetManifestHash"
    RoomSettings:
      type: "object"
      additionalProperties: false
      properties:
        arenaId:
          type: "string"
          const: "arena-1"
          default: "arena-1"
        capacity:
          type: "integer"
          enum:
            - 2
            - 3
            - 4
          default: 4
        targetChakra:
          type: "integer"
          minimum: 0
          maximum: 99999
        rule:
          type: "string"
          enum:
            - "normal"
        voiceEnabled:
          type: "boolean"
      required:
        - "arenaId"
        - "capacity"
        - "targetChakra"
        - "rule"
        - "voiceEnabled"
    CreateRoomRequest:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 60
        visibility:
          type: "string"
          enum:
            - "public"
            - "private"
        settings:
          $ref: "#/components/schemas/RoomSettings"
      required:
        - "name"
        - "visibility"
        - "settings"
    JoinRoomRequest:
      type: "object"
      additionalProperties: false
      properties:
        inviteCode:
          type: "string"
          minLength: 6
          maxLength: 32
          pattern: "^[A-Z0-9-]+$"
      required:
        []
    JoinByCodeRequest:
      type: "object"
      additionalProperties: false
      properties:
        inviteCode:
          type: "string"
          minLength: 6
          maxLength: 32
          pattern: "^[A-Z0-9-]+$"
      required:
        - "inviteCode"
    RoomSummary:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        host:
          $ref: "#/components/schemas/PlayerIdentity"
        visibility:
          type: "string"
          enum:
            - "public"
            - "private"
        status:
          type: "string"
          enum:
            - "waiting"
            - "playing"
            - "results"
        settings:
          $ref: "#/components/schemas/RoomSettings"
        memberCount:
          type: "integer"
          minimum: 0
          maximum: 4
        roomVersion:
          type: "integer"
          minimum: 0
        canJoin:
          type: "boolean"
        createdAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "name"
        - "host"
        - "visibility"
        - "status"
        - "settings"
        - "memberCount"
        - "roomVersion"
        - "canJoin"
        - "createdAt"
    RoomMember:
      type: "object"
      additionalProperties: false
      properties:
        userId:
          type: "string"
          format: "uuid"
        displayName:
          type: "string"
        seat:
          type: "integer"
          minimum: 0
          maximum: 3
        characterId:
          type: "integer"
          enum:
            - 0
            - 1
            - 2
            - 3
        ready:
          type: "boolean"
        assetsReady:
          type: "boolean"
        connectionStatus:
          type: "string"
          enum:
            - "connected"
            - "reconnecting"
            - "disconnected"
        joinedAt:
          type: "string"
          format: "date-time"
      required:
        - "userId"
        - "displayName"
        - "seat"
        - "characterId"
        - "ready"
        - "assetsReady"
        - "connectionStatus"
        - "joinedAt"
    Room:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        hostUserId:
          type: "string"
          format: "uuid"
        visibility:
          type: "string"
          enum:
            - "public"
            - "private"
        status:
          type: "string"
          enum:
            - "waiting"
            - "playing"
            - "results"
        settings:
          $ref: "#/components/schemas/RoomSettings"
        roomVersion:
          type: "integer"
          minimum: 0
        members:
          type: "array"
          items:
            $ref: "#/components/schemas/RoomMember"
          maxItems: 4
        activeMatchId:
          anyOf:
            -
              type: "string"
              format: "uuid"
            -
              type: "null"
        createdAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "name"
        - "hostUserId"
        - "visibility"
        - "status"
        - "settings"
        - "roomVersion"
        - "members"
        - "activeMatchId"
        - "createdAt"
    RoomMembership:
      type: "object"
      additionalProperties: false
      properties:
        room:
          $ref: "#/components/schemas/Room"
        selfSeat:
          type: "integer"
          minimum: 0
          maximum: 3
        inviteCode:
          anyOf:
            -
              type: "string"
              description: "Hanya host room privat yang menerima kode; tidak muncul dalam daftar room."
            -
              type: "null"
      required:
        - "room"
        - "selfSeat"
        - "inviteCode"
    RoomPage:
      type: "object"
      additionalProperties: false
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/RoomSummary"
        nextCursor:
          anyOf:
            -
              type: "string"
            -
              type: "null"
      required:
        - "items"
        - "nextCursor"
    VoiceToken:
      type: "object"
      additionalProperties: false
      properties:
        url:
          type: "string"
          format: "uri"
          description: "URL signaling WSS SFU yang dapat dijangkau client."
        token:
          type: "string"
          description: "Token singkat, identity/session dan room terikat, publish audio saja. Jangan log."
        expiresAt:
          type: "string"
          format: "date-time"
        roomId:
          type: "string"
          format: "uuid"
        identity:
          type: "string"
          format: "uuid"
        canPublishAudio:
          type: "boolean"
          const: true
        canPublishVideo:
          type: "boolean"
          const: false
        canSubscribe:
          type: "boolean"
          const: true
      required:
        - "url"
        - "token"
        - "expiresAt"
        - "roomId"
        - "identity"
        - "canPublishAudio"
        - "canPublishVideo"
        - "canSubscribe"
    ChatMessage:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
        roomId:
          type: "string"
          format: "uuid"
        sender:
          anyOf:
            -
              $ref: "#/components/schemas/PlayerIdentity"
            -
              type: "null"
        kind:
          type: "string"
          enum:
            - "user"
            - "system"
        text:
          type: "string"
          minLength: 1
          maxLength: 300
        createdAt:
          type: "string"
          format: "date-time"
        clientMessageId:
          anyOf:
            -
              type: "string"
              format: "uuid"
            -
              type: "null"
      required:
        - "id"
        - "roomId"
        - "sender"
        - "kind"
        - "text"
        - "createdAt"
        - "clientMessageId"
    ChatPage:
      type: "object"
      additionalProperties: false
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/ChatMessage"
          maxItems: 50
        nextCursor:
          anyOf:
            -
              type: "string"
            -
              type: "null"
      required:
        - "items"
        - "nextCursor"
    ReportRequest:
      type: "object"
      additionalProperties: false
      properties:
        roomId:
          type: "string"
          format: "uuid"
        matchId:
          type: "string"
          format: "uuid"
        targetUserId:
          type: "string"
          format: "uuid"
        messageId:
          type: "string"
          format: "uuid"
        category:
          type: "string"
          enum:
            - "chat_abuse"
            - "voice_abuse"
            - "cheating"
            - "other"
        description:
          type: "string"
          minLength: 1
          maxLength: 1000
      required:
        - "roomId"
        - "targetUserId"
        - "category"
        - "description"
    ReportReceipt:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
        createdAt:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "createdAt"
    UserBlock:
      type: "object"
      additionalProperties: false
      properties:
        targetUserId:
          type: "string"
          format: "uuid"
        createdAt:
          type: "string"
          format: "date-time"
      required:
        - "targetUserId"
        - "createdAt"
    MatchPhase:
      type: "string"
      enum:
        - "turn_start"
        - "pre_move"
        - "roulette"
        - "movement"
        - "tile_resolution"
        - "combat"
        - "source_bonus"
        - "turn_end"
        - "results"
        - "paused_error"
    ControllerKind:
      type: "string"
      enum:
        - "human"
        - "cpu"
    ControllerState:
      type: "object"
      additionalProperties: false
      properties:
        seat:
          type: "integer"
          minimum: 0
          maximum: 3
        userId:
          type: "string"
          format: "uuid"
        participantKind:
          type: "string"
          const: "human"
        controllerKind:
          $ref: "#/components/schemas/ControllerKind"
        controlEpoch:
          type: "integer"
          minimum: 0
        connectionStatus:
          type: "string"
          enum:
            - "connected"
            - "reconnecting"
            - "disconnected"
        reason:
          anyOf:
            -
              type: "string"
              enum:
                - "disconnect"
                - "inactivity"
                - "reconnect"
                - "logout"
            -
              type: "null"
        reclaimPending:
          type: "boolean"
      required:
        - "seat"
        - "userId"
        - "participantKind"
        - "controllerKind"
        - "controlEpoch"
        - "connectionStatus"
        - "reason"
        - "reclaimPending"
    TileState:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "integer"
          minimum: 0
          maximum: 21
        typeCode:
          type: "integer"
          enum:
            - 0
            - 1
            - 2
            - 4
            - 5
        ownerSeat:
          anyOf:
            -
              type: "integer"
              minimum: 0
              maximum: 3
            -
              type: "null"
        level:
          type: "integer"
          minimum: 0
          maximum: 5
        hp:
          type: "integer"
          minimum: 0
          maximum: 6
        effectId:
          type: "integer"
          minimum: 0
          maximum: 255
        repairCounter:
          type: "integer"
          minimum: 0
        x:
          type: "integer"
          minimum: 0
        y:
          type: "integer"
          minimum: 0
        neighbors:
          type: "array"
          items:
            anyOf:
              -
                type: "integer"
                minimum: 0
                maximum: 21
              -
                type: "null"
          minItems: 4
          maxItems: 4
          description: "Urutan slot native dipertahankan; sentinel 255 diproyeksikan null."
        purchasePrice:
          type: "integer"
          minimum: 0
        upgradeBase:
          type: "integer"
          minimum: 0
        rents:
          type: "array"
          items:
            type: "integer"
            minimum: 0
          minItems: 5
          maxItems: 5
      required:
        - "id"
        - "typeCode"
        - "ownerSeat"
        - "level"
        - "hp"
        - "effectId"
        - "repairCounter"
        - "x"
        - "y"
        - "neighbors"
        - "purchasePrice"
        - "upgradeBase"
        - "rents"
    PlayerState:
      type: "object"
      additionalProperties: false
      properties:
        userId:
          type: "string"
          format: "uuid"
        seat:
          type: "integer"
          minimum: 0
          maximum: 3
        displayName:
          type: "string"
        characterId:
          type: "integer"
          enum:
            - 0
            - 1
            - 2
            - 3
        position:
          type: "integer"
